# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free-compute staging. The website dispatches to its API in process within one service.
# Retain the former API as a configuration source and migration fallback.
services:
  - type: web
    name: aquamind-api-free
    runtime: python
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: >-
      python -m pip install --index-url https://download.pytorch.org/whl/cpu -r ml/requirements.txt
      && python -m pip install -r ml/requirements-cloud.txt && python -m pip check
      && PYTHONPATH=ml python -m aquamind_ml.model_release --output ml/artifacts/served-detector-v1
    startCommand: >-
      python -m uvicorn aquamind_ml.api:app --host 0.0.0.0 --port "$PORT" --workers 1
      --no-proxy-headers --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.2"
      - key: PYTHONPATH
        value: ml
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AQUAMIND_INFERENCE_ENABLED
        value: "1"
      - key: AQUAMIND_DETECTOR_PATH
        value: ml/artifacts/served-detector-v1
      - key: AQUAMIND_AGENT_ENABLED
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: AQUAMIND_PUBLIC_MODE
        value: "1"
      - key: AQUAMIND_RELAY_REQUIRED
        value: "1"
      - key: AQUAMIND_RELAY_SECRET
        generateValue: true
      - key: AQUAMIND_USAGE_STORE
        value: upstash
      - key: AQUAMIND_AI_DAILY_STAGE_LIMIT
        value: "20"

  - type: web
    name: aqua
    runtime: docker
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./services/combined/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: AQUAMIND_PUBLIC_MODE
        value: "1"
      - key: AQUAMIND_RELAY_REQUIRED
        value: "1"
      - key: AQUAMIND_RELAY_SECRET
        fromService:
          type: web
          name: aquamind-api-free
          envVarKey: AQUAMIND_RELAY_SECRET
      - key: AQUAMIND_INFERENCE_ENABLED
        value: "1"
      - key: AQUAMIND_DETECTOR_PATH
        value: ml/artifacts/served-detector-v1
      - key: AQUAMIND_USAGE_STORE
        value: upstash
      - key: AQUAMIND_AGENT_ENABLED
        fromService:
          type: web
          name: aquamind-api-free
          envVarKey: AQUAMIND_AGENT_ENABLED
      - key: AQUAMIND_AI_DAILY_STAGE_LIMIT
        fromService:
          type: web
          name: aquamind-api-free
          envVarKey: AQUAMIND_AI_DAILY_STAGE_LIMIT
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: aquamind-api-free
          envVarKey: OPENAI_API_KEY
      - key: OPENAI_MODEL
        fromService:
          type: web
          name: aquamind-api-free
          envVarKey: OPENAI_MODEL
      - key: UPSTASH_REDIS_REST_URL
        fromService:
          type: web
          name: aquamind-api-free
          envVarKey: UPSTASH_REDIS_REST_URL
      - key: UPSTASH_REDIS_REST_TOKEN
        fromService:
          type: web
          name: aquamind-api-free
          envVarKey: UPSTASH_REDIS_REST_TOKEN
