# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free-compute staging. Read docs/deployment.md for limits and optional AI setup.
services:
  - type: web
    name: aquamind-api-free
    runtime: python
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install -r ml/requirements-cloud.txt && python -m pip check
    startCommand: >-
      python -m uvicorn aquamind_ml.api:app --host 0.0.0.0 --port "$PORT" --workers 1
      --no-proxy-headers --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.2"
      - key: PYTHONPATH
        value: ml
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AQUAMIND_INFERENCE_ENABLED
        value: "0"
      - key: AQUAMIND_AGENT_ENABLED
        sync: false
      - key: AQUAMIND_PUBLIC_MODE
        value: "1"
      - key: AQUAMIND_RELAY_REQUIRED
        value: "1"
      - key: AQUAMIND_RELAY_SECRET
        generateValue: true
      - key: AQUAMIND_USAGE_STORE
        value: upstash
      - key: AQUAMIND_AI_DAILY_STAGE_LIMIT
        value: "20"

  - type: web
    name: aqua
    runtime: node
    region: oregon
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build --webpack
    startCommand: >-
      AQUAMIND_API_URL="https://${AQUAMIND_API_HOSTNAME}"
      pnpm --filter web start --hostname 0.0.0.0 --port "$PORT"
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: AQUAMIND_PUBLIC_MODE
        value: "1"
      - key: AQUAMIND_RELAY_REQUIRED
        value: "1"
      - key: AQUAMIND_RELAY_SECRET
        fromService:
          type: web
          name: aquamind-api-free
          envVarKey: AQUAMIND_RELAY_SECRET
      - key: AQUAMIND_API_HOSTNAME
        fromService:
          type: web
          name: aquamind-api-free
          envVarKey: RENDER_EXTERNAL_HOSTNAME
