name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  AQUAMIND_AGENT_ENABLED: "0"
  AQUAMIND_PUBLIC_MODE: "0"
  AQUAMIND_RELAY_REQUIRED: "0"

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build --webpack

  python:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ml
      AQUAMIND_INFERENCE_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: ml/requirements*.txt
      - name: Install CPU detector and agent dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu -r ml/requirements.txt
          python -m pip install -r ml/requirements-agent.txt
          python -m pip check
      - run: python -m unittest discover -s ml/tests -v

  cloud:
    name: Cloud and Redis checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ml:ml/tests
      AQUAMIND_INFERENCE_ENABLED: "0"
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: ml/requirements-cloud.txt
      - name: Install lightweight service dependencies and test tools
        run: |
          python -m pip install -r ml/requirements-cloud.txt
          python -m pip check
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-tools lua5.4
      - name: Verify PyTorch is absent
        run: python -c 'import importlib.util; assert importlib.util.find_spec("torch") is None'
      - name: Test cloud API, provider boundaries and actual Redis admission
        env:
          AQUAMIND_TEST_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: >-
          python -m unittest -v test_lightweight_api test_remote_budget
          test_relay_authorization test_redis_budget_integration
          test_topic_guard test_topic_guard_http
          test_model_release test_web

  combined:
    name: Combined service checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the single-service runtime without credentials
        run: docker build --platform linux/amd64 -t aquamind-combined -f services/combined/Dockerfile .
      - name: Verify startup and HTTP contracts within Free runtime limits
        run: |
          set -eu
          trap 'docker logs aquamind-combined-test; docker rm -f aquamind-combined-test' EXIT
          docker run -d --name aquamind-combined-test --platform linux/amd64 \
            --memory 512m --memory-swap 512m --cpus 0.1 --network none \
            -e AQUAMIND_AGENT_ENABLED=1 -e AQUAMIND_INFERENCE_ENABLED=1 \
            -e AQUAMIND_PUBLIC_MODE=1 -e AQUAMIND_RELAY_REQUIRED=1 \
            -e AQUAMIND_RELAY_SECRET=capacity-placeholder-relay-key-123456789 \
            -e AQUAMIND_USAGE_STORE=upstash \
            -e UPSTASH_REDIS_REST_URL=https://capacity.upstash.io \
            -e UPSTASH_REDIS_REST_TOKEN=capacity-placeholder-token \
            -e OPENAI_API_KEY=capacity-placeholder-key -e OPENAI_MODEL=gpt-5.4-mini \
            -e PORT=10000 aquamind-combined
          docker exec -i aquamind-combined-test python - < services/combined/smoke.py

  ci:
    name: CI gate
    if: ${{ always() }}
    needs: [web, python, cloud, combined]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every check to pass
        env:
          WEB_RESULT: ${{ needs.web.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          CLOUD_RESULT: ${{ needs.cloud.result }}
          COMBINED_RESULT: ${{ needs.combined.result }}
        run: |
          test "$WEB_RESULT" = success
          test "$PYTHON_RESULT" = success
          test "$CLOUD_RESULT" = success
          test "$COMBINED_RESULT" = success
